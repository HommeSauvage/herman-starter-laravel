# Git hooks — installed automatically by `composer setup` (via lefthook).
#
# The hook enforces the same gate documented for agents in AGENTS.md, so
# nothing gets committed that `composer run ci:check` would reject. It is
# intentionally the *same* command — one source of truth, no hook-only checks.
#
# Bypass in an emergency with `git commit --no-verify` (the CI gate still
# runs the same checks).

pre-commit:
  commands:
    ci-check:
      run: composer run ci:check
      stage_fixed: true

# Wayfinder output (resources/js/{actions,routes}) and the Laravel runtime
# dirs are gitignored, so a checkout into a fresh git worktree has neither —
# and then `tsc` / `bun run build` fail on missing imports, and artisan
# refuses to boot without storage/framework. One script, both hooks.
post-checkout:
  commands:
    prepare-wayfinder:
      run: sh scripts/prepare-wayfinder.sh

post-merge:
  commands:
    prepare-wayfinder:
      run: sh scripts/prepare-wayfinder.sh
