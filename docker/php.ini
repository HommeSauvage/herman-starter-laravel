; Tenant runtime PHP settings (FrankenPHP classic mode).
;
; Classic mode is shared-nothing: every request is its own PHP execution, so a
; runaway request (an accidental unbounded query, a cache built in a loop) dies
; at memory_limit with a fatal error in that one request. The worker survives
; and the container keeps serving — unlike a long-lived Node process, where the
; same bug grows the heap until the kernel OOM-kills the whole container.
;
; Keep the container limit comfortably above memory_limit; raise this number
; deliberately, never by default. Queue workers and Octane/FrankenPHP worker
; mode are long-lived: there, also cap work per process (--max-jobs /
; --max-requests) — see the MemoryGuard test.

memory_limit = 256M

; PHP 8.5+: cap how far memory_limit may be raised at runtime, so a stray
; ini_set() (or an agent-written "quick fix") cannot bypass the request budget.
max_memory_limit = 512M
